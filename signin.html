<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn-uicons.flaticon.com https://www.gstatic.com https://cdn.firebase.com; style-src 'self' https://fonts.googleapis.com https://cdn-uicons.flaticon.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdn-uicons.flaticon.com; img-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com https://www.gstatic.com;">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — e-Safe | Cissy Technologies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-thin-rounded/css/uicons-thin-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-thin-straight/css/uicons-thin-straight.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="register-body">

  <div class="register-wrap">
    <div class="register-card">

      <!-- Back arrow -->
      <a href="index.html" class="back-arrow" aria-label="Back to homepage">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <!-- Logo -->
      <a href="index.html" class="nav-logo" style="margin-bottom:1.5rem">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 28 28" fill="none">
            <path d="M14 2L4 7V14C4 19.5 8.4 24.7 14 26C19.6 24.7 24 19.5 24 14V7L14 2Z" stroke="#1A2744" stroke-width="2" stroke-linejoin="round"/>
            <path d="M10 14L13 17L18 11" stroke="#1A2744" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div style="font-size:16px;font-weight:700;color:#1A2744;line-height:1.1">e-Safe</div>
          <div style="font-size:11px;color:#9CA3AF;line-height:1">by Cissy Technologies</div>
        </div>
      </a>

      <h1 class="register-title">Sign In</h1>
      <p class="register-sub">Welcome back. Sign in to continue your training.</p>

      <div class="form-banner error" id="signinBanner" style="display:none">
        <i class="fi fi-tr-info"></i>
        <span id="signinBannerText"></span>
      </div>

      <!-- FORM -->
      <form id="signinForm" novalidate>

        <label class="input-label" for="signinEmail">Work Email</label>
        <input
          type="email"
          id="signinEmail"
          name="signinEmail"
          class="input-field"
          placeholder="john.smith@company.com"
          autocomplete="username"
          required
        />
        <span class="input-error" id="signinEmailError">Please enter a valid work email</span>

        <label class="input-label" for="signinPassword">Password</label>
        <input
          type="password"
          id="signinPassword"
          name="signinPassword"
          class="input-field"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
        <span class="input-error" id="signinPasswordError">Please enter your password</span>

        <span class="input-error" id="signinFormError"></span>

        <button type="submit" class="btn-primary" id="signinSubmitBtn" style="width:100%;justify-content:center;margin-top:1.25rem">
          Sign In
        </button>

        <p class="signin-link">
          New to e-Safe? <a href="register.html"><strong>Create an account</strong></a>
        </p>

        <p class="admin-note">Admin? Use your admin credentials to sign in.</p>

      </form>

    </div>
  </div>

  <!-- Firebase SDK (compat build — plain script tags, no bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="main.js"></script>
</body>
</html>
