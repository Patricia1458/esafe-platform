<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn-uicons.flaticon.com https://www.gstatic.com https://cdn.firebase.com; style-src 'self' https://fonts.googleapis.com https://cdn-uicons.flaticon.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdn-uicons.flaticon.com; img-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com https://www.gstatic.com;">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — e-Safe | Cissy Technologies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-thin-rounded/css/uicons-thin-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-thin-straight/css/uicons-thin-straight.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="profile-body">

  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 28 28" fill="none">
            <path d="M14 2L4 7V14C4 19.5 8.4 24.7 14 26C19.6 24.7 24 19.5 24 14V7L14 2Z" stroke="#1A2744" stroke-width="2" stroke-linejoin="round"/>
            <path d="M10 14L13 17L18 11" stroke="#1A2744" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div style="font-size:16px;font-weight:700;color:#1A2744;line-height:1.1">e-Safe</div>
          <div style="font-size:11px;color:#9CA3AF;line-height:1">by Cissy Technologies</div>
        </div>
      </a>
      <div class="nav-links">
        <a href="dashboard.html" class="nav-link">My Progress</a>
        <a href="resources.html" class="nav-link">Resources</a>
        <a href="profile.html" class="nav-link">My Profile</a>
        <a href="#" class="nav-link" id="signOutBtn">Sign out</a>
        <div class="user-avatar" id="userAvatar">JS</div>
      </div>
    </div>
  </nav>

  <main class="dashboard-main">
    <div class="dashboard-container" style="max-width:720px">

      <h1 class="welcome-title" style="margin-bottom:1.5rem">My Profile</h1>

      <div class="dash-card" id="profileCard">

        <div style="display:flex;align-items:center;gap:16px;margin-bottom:1.75rem">
          <div class="character-avatar" id="profileAvatar" style="width:56px;height:56px;font-size:18px">--</div>
          <div>
            <div class="welcome-title" id="profileName" style="font-size:20px;margin-bottom:2px">Employee Name</div>
            <div class="cert-banner-sub" id="profileDepartment">Department</div>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-card-num" id="profileModulesCompleted">0/10</div>
            <div class="stat-card-label">Modules Completed</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-num" id="profileQuizScore">&mdash;</div>
            <div class="stat-card-label">Final Quiz Score</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-num" id="profileCertStatus">
              <i class="fi fi-tr-lock" style="font-size:20px;color:#9CA3AF"></i>
            </div>
            <div class="stat-card-label">Certificate</div>
          </div>
        </div>

        <div id="profileCertAction"></div>

      </div>

      <div class="dash-card" id="profileModulesCard">
        <h3 style="font-size:15px;font-weight:700;color:var(--navy);margin-bottom:1rem">Completed Modules</h3>
        <ul class="action-steps-list" id="profileModulesList"></ul>
      </div>

    </div>
  </main>

  <!-- Firebase SDK (compat build — plain script tags, no bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="main.js"></script>
</body>
</html>
